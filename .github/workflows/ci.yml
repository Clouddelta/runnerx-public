name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: runnerx_test
          MYSQL_USER: runnerx_test
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: runnerx_test
      DB_PASSWORD: ci-only-password
      DB_NAME: runnerx_test
      DB_UNIX_SOCKET: ""
      RUNNERX_TEST_DATABASE_URL: mysql+pymysql://runnerx_test:ci-only-password@127.0.0.1:3306/runnerx_test
      MYSQL_ROOT_PASSWORD: compose-ci-only-root-password
      MYSQL_HOST_PORT: "3308"
      API_PORT: "8002"
      DEMO_API_KEY: compose-ci-only-demo-api-key-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and test dependencies
        run: python -m pip install ".[dev]"
      - name: Migrate an empty MySQL database
        run: alembic upgrade head
      - name: Run unit and MySQL lifecycle tests
        run: python -m pytest -p no:cacheprovider
      - name: Build the production container
        run: docker build --tag runnerx:ci .
      - name: Verify Docker business flows and backup recovery
        run: |
          docker tag runnerx:ci runnerx-public:local
          docker compose up -d --no-build --wait --wait-timeout 180
          docker compose --profile tools run --rm seed
          mkdir -p .local
          docker compose --profile tools run --rm verify > .local/acceptance.json
          cat .local/acceptance.json
          python scripts/backup_restore.py backup --output .local/backups/ci
          python scripts/backup_restore.py restore --backup .local/backups/ci --database runnerx_ci_restore_test
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --tail 100 db migrate api
      - name: Stop Compose services
        if: always()
        run: docker compose down

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: Validate Terraform without provisioning resources
        working-directory: infra/gcp
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate deployment script syntax
        run: bash -n infra/gcp/deploy.sh
      - name: Verify release failure gates with fake cloud commands
        run: python -m unittest discover -s infra/gcp -p test_deploy.py -v
